<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ProTips</title>
    <?!= include('style.css'); ?>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="login-overlay">
        <div class="glass-card" style="max-width: 400px; width: 90%;">
            <h2 class="text-center" style="margin-bottom: 20px;">Admin Login</h2>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="admin-pass" placeholder="Enter admin password">
            </div>
            <button onclick="adminLogin()" class="btn-primary w-full">Access Dashboard</button>
        </div>
    </div>

    <nav class="glass-nav">
        <div class="container nav-content">
            <div class="logo">
                <i data-lucide="zap" class="icon-purple"></i>
                <span>ProTips Admin</span>
            </div>
            <button id="theme-toggle" class="btn-icon">
                <i data-lucide="sun" class="sun-icon"></i>
                <i data-lucide="moon" class="moon-icon"></i>
            </button>
        </div>
    </nav>

    <div class="admin-container">
        <aside>
            <nav style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="refreshData()" class="btn-secondary w-full text-left" style="display: flex; align-items: center; gap: 10px; justify-content: flex-start;">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </button>
                <button onclick="refreshData()" class="btn-secondary w-full text-left" style="display: flex; align-items: center; gap: 10px; justify-content: flex-start;">
                    <i data-lucide="list"></i> Submissions
                </button>
                <button onclick="goToPage('index')" class="btn-secondary w-full text-left" style="display: flex; align-items: center; gap: 10px; justify-content: flex-start; margin-top: 20px; color: #ef4444;">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="stats-grid">
                <div class="stat-card">
                    <p>Total Submissions</p>
                    <div class="stat-value" id="total-subs">0</div>
                </div>
                <div class="stat-card">
                    <p>Pending Review</p>
                    <div class="stat-value" id="pending-subs" style="color: var(--pending);">0</div>
                </div>
                <div class="stat-card">
                    <p>Completed</p>
                    <div class="stat-value" id="completed-subs" style="color: var(--success);">0</div>
                </div>
            </div>

            <div class="glass-card" style="padding: 0;">
                <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <h3>Recent Submissions</h3>
                    <button class="btn-icon" onclick="refreshData()"><i data-lucide="refresh-cw"></i></button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="submissions-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Question</th>
                                <th>Status</th>
                                <th>Proof</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-body">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Reply -->
    <div id="reply-modal" style="display:none; position: fixed; inset:0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 20px;">
        <div class="glass-card" style="max-width: 600px; width: 100%;">
            <h3>Reply to Submission</h3>
            <p id="reply-user" style="margin-bottom: 20px; color: #94a3b8;"></p>
            <div class="input-group">
                <label>Status</label>
                <select id="update-status" style="width: 100%; padding: 12px; border-radius: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
                    <option value="Pending Review">Pending Review</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="input-group">
                <label>Your Advice</label>
                <textarea id="reply-text" rows="5" placeholder="Write your tips here..."></textarea>
            </div>
            <div class="btn-group">
                <button onclick="closeReply()" class="btn-secondary">Cancel</button>
                <button onclick="submitReply()" class="btn-primary">Send Advice</button>
            </div>
        </div>
    </div>

    <?!= include('script.js'); ?>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
