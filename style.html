<style>
:root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --secondary: #a855f7;
    --bg-light: #f8fafc;
    --bg-dark: #030712;
    --text-light: #1e293b;
    --text-dark: #f8fafc;
    --glass-light: rgba(255, 255, 255, 0.7);
    --glass-dark: rgba(17, 24, 39, 0.7);
    --border-light: rgba(0, 0, 0, 0.1);
    --border-dark: rgba(255, 255, 255, 0.1);
    --success: #10b981;
    --pending: #f59e0b;
    --error: #ef4444;
}

[data-theme="light"] {
    --bg: var(--bg-light);
    --text: var(--text-light);
    --glass: var(--glass-light);
    --border: var(--border-light);
}

[data-theme="dark"] {
    --bg: var(--bg-dark);
    --text: var(--text-dark);
    --glass: var(--glass-dark);
    --border: var(--border-dark);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
    background-color: var(--bg);
    color: var(--text);
    transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;
    line-height: 1.6;
    overflow-x: hidden;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
}

/* Background Gradients */
.bg-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
}

.glow-1 {
    position: absolute;
    top: -10%;
    right: -10%;
    width: 50vw;
    height: 50vw;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
    filter: blur(80px);
}

.glow-2 {
    position: absolute;
    bottom: -10%;
    left: -10%;
    width: 40vw;
    height: 40vw;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
    filter: blur(80px);
}

/* Navigation */
.glass-nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    backdrop-filter: blur(12px);
    background: var(--glass);
    border-bottom: 1px solid var(--border);
    height: 70px;
    display: flex;
    align-items: center;
}

.nav-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    cursor: pointer;
}

.icon-purple { color: var(--secondary); }

.btn-icon {
    background: none;
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-icon:hover {
    background: var(--border);
    transform: translateY(-2px);
}

[data-theme="dark"] .sun-icon { display: block; }
[data-theme="dark"] .moon-icon { display: none; }
[data-theme="light"] .sun-icon { display: none; }
[data-theme="light"] .moon-icon { display: block; }

/* Hero Section */
.hero-section {
    padding: 180px 0 100px;
    text-align: center;
}

.hero-badge {
    background: rgba(99, 102, 241, 0.1);
    color: var(--primary);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 0.875rem;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 24px;
    border: 1px solid rgba(99, 102, 241, 0.2);
}

.gradient-text {
    font-size: 4rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
    line-height: 1.1;
    letter-spacing: -2px;
}

.subtitle {
    font-size: 1.25rem;
    color: #94a3b8;
    max-width: 650px;
    margin: 0 auto 48px;
}

/* Glass Card */
.glass-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 48px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    margin-bottom: 100px;
}

/* Form Steps */
.form-step {
    display: none;
    animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.form-step.active {
    display: block;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-step h2 {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 2rem;
    font-weight: 800;
}

.form-step p {
    color: #94a3b8;
    margin-bottom: 32px;
    font-size: 1.1rem;
}

/* Inputs */
.input-group {
    margin-bottom: 24px;
}

.input-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
}

input[type="text"],
input[type="password"],
textarea,
select {
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 1rem;
}

/* Buttons */
.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    padding: 18px 32px;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 16px 32px;
    border-radius: 16px;
    font-weight: 600;
    cursor: pointer;
}

/* Payment Info */
.payment-info {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 32px;
    text-align: center;
}

.dana-logo-text {
    font-size: 2.5rem;
    font-weight: 900;
    color: #0081c0;
    letter-spacing: -1px;
    margin-bottom: 12px;
}

.qris-placeholder {
    margin: 24px auto;
    padding: 24px;
    background: white;
    width: fit-content;
    border-radius: 20px;
    color: black;
}

/* Admin Styles */
.admin-container {
    display: flex;
    min-height: 100vh;
    padding-top: 70px;
    background: var(--bg);
}

aside {
    width: 280px;
    background: var(--glass);
    border-right: 1px solid var(--border);
    padding: 40px 24px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
}

.admin-main {
    flex-grow: 1;
    padding: 48px;
    overflow-y: auto;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin-bottom: 48px;
}

.stat-card {
    background: var(--glass);
    padding: 32px;
    border-radius: 24px;
    border: 1px solid var(--border);
    text-align: center;
}

.stat-value {
    font-size: 2.5rem;
    font-weight: 900;
    color: var(--primary);
}

.submissions-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

th, td {
    padding: 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
}

th {
    background: rgba(255,255,255,0.02);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 1px;
    color: #64748b;
}

.status-pill {
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 800;
}

/* Toast */
.toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--glass);
    padding: 16px 24px;
    border-radius: 16px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    transform: translateY(100px);
    opacity: 0;
    transition: 0.4s;
    z-index: 9999;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* Features */
.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 32px;
    margin-bottom: 120px;
}

.feature-card {
    background: var(--glass);
    padding: 40px;
    border-radius: 28px;
    border: 1px solid var(--border);
    transition: 0.4s;
}

.feature-card:hover {
    transform: translateY(-10px);
}

/* Custom File Upload */
.custom-file-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 48px;
    border: 2px dashed var(--border);
    border-radius: 24px;
    cursor: pointer;
}

/* Footer */
footer {
    text-align: center;
    padding: 60px 0;
    border-top: 1px solid var(--border);
    color: #94a3b8;
}

/* Responsive */
@media (max-width: 768px) {
    .admin-container { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); height: auto; position: static; }
    .admin-main { padding: 24px; }
    .gradient-text { font-size: 2.75rem; }
}
</style>
