<script>
// State Management
let currentStep = 1;
let userData = {
    name: '',
    question: '',
    proof: null
};
let adminAuthToken = null;

// Theme Toggle
const themeToggle = document.getElementById('theme-toggle');
if (themeToggle) {
    themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
}

// Load Theme from LocalStorage
document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
});

// Toast Helper
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');

    if (!toast) return;

    toast.className = `toast show ${type}`;
    toastMsg.innerText = message;

    // Set icon based on type
    if (window.lucide) {
        const iconName = type === 'success' ? 'check-circle' : 'alert-circle';
        toastIcon.setAttribute('data-lucide', iconName);
        lucide.createIcons();
    }

    setTimeout(() => {
        toast.classList.remove('show');
    }, 4000);
}

// Navigation Functions
function scrollToForm() {
    const formSection = document.getElementById('form-section');
    if (formSection) formSection.scrollIntoView({ behavior: 'smooth' });
}

function nextStep(step) {
    document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
    const targetStep = document.getElementById(`step-${step}`);
    if (targetStep) targetStep.classList.add('active');
    currentStep = step;
}

function prevStep(step) {
    nextStep(step);
}

// Step 1: Form Submission
const tipsForm = document.getElementById('tips-form');
if (tipsForm) {
    tipsForm.addEventListener('submit', (e) => {
        e.preventDefault();
        userData.name = document.getElementById('full-name').value;
        userData.question = document.getElementById('question').value;
        nextStep(2);
        showToast('Question details saved!', 'success');
    });
}

// Step 2: Payment Proof Handling
const proofInput = document.getElementById('payment-proof');
const submitProofBtn = document.getElementById('submit-proof');
const fileNameDisplay = document.getElementById('file-name-display');

if (proofInput) {
    proofInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userData.proof = {
                    data: event.target.result.split(',')[1],
                    type: file.type,
                    name: file.name
                };
                fileNameDisplay.innerText = `✅ ${file.name} selected`;
                submitProofBtn.disabled = false;
                showToast('File uploaded successfully!', 'success');
            };
            reader.readAsDataURL(file);
        }
    });
}

if (submitProofBtn) {
    submitProofBtn.addEventListener('click', () => {
        submitProofBtn.disabled = true;
        submitProofBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Processing...';
        if (window.lucide) lucide.createIcons();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(() => {
                    nextStep(3);
                    showToast('Submission successful!', 'success');
                })
                .withFailureHandler((err) => {
                    showToast('Submission failed: ' + err, 'error');
                    submitProofBtn.disabled = false;
                    submitProofBtn.innerHTML = 'Submit & Confirm Payment <i data-lucide="check-circle"></i>';
                    if (window.lucide) lucide.createIcons();
                })
                .processSubmission(userData);
        } else {
            // Fallback for local testing
            setTimeout(() => {
                nextStep(3);
                showToast('Submission successful (Demo Mode)!', 'success');
            }, 2000);
        }
    });
}

function copyNumber() {
    const num = document.getElementById('dana-number').innerText;
    navigator.clipboard.writeText(num).then(() => {
        showToast('DANA number copied!', 'success');
    });
}

function resetForm() {
    if (tipsForm) tipsForm.reset();
    if (fileNameDisplay) fileNameDisplay.innerText = '';
    if (submitProofBtn) {
        submitProofBtn.disabled = true;
        submitProofBtn.innerHTML = 'Submit & Confirm Payment <i data-lucide="check-circle"></i>';
    }
    nextStep(1);
    if (window.lucide) lucide.createIcons();
}

// Admin Logic
function adminLogin() {
    const pass = document.getElementById('admin-pass').value;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler((isValid) => {
                if (isValid) {
                    adminAuthToken = pass;
                    document.getElementById('login-overlay').style.display = 'none';
                    showToast('Admin logged in!', 'success');
                    refreshData();
                } else {
                    showToast('Invalid Password', 'error');
                }
            })
            .verifyAdminPassword(pass);
    } else {
        if (pass === 'admin123') {
            adminAuthToken = pass;
            document.getElementById('login-overlay').style.display = 'none';
            showToast('Admin logged in (Demo Mode)!', 'success');
            refreshData();
        } else {
            showToast('Invalid Password', 'error');
        }
    }
}

function refreshData() {
    const tbody = document.getElementById('submissions-body');
    if (!tbody) return;

    tbody.innerHTML = '<tr><td colspan="5" class="text-center"><i data-lucide="loader" class="spin"></i> Loading...</td></tr>';
    if (window.lucide) lucide.createIcons();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler((data) => {
                if (data.error) {
                    showToast(data.error, 'error');
                    document.getElementById('login-overlay').style.display = 'flex';
                } else {
                    renderSubmissions(data);
                }
            })
            .getDashboardData(adminAuthToken);
    } else {
        const mockData = [
            { id: 2, name: 'John Doe', question: 'How can I start a SaaS business with no coding skills?', status: 'Pending Review', proof: '#' },
            { id: 3, name: 'Alice Smith', question: 'Best strategies for scaling a digital marketing agency in 2024?', status: 'Completed', proof: '#' }
        ];
        setTimeout(() => renderSubmissions(mockData), 1000);
    }
}

function renderSubmissions(data) {
    const tbody = document.getElementById('submissions-body');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No submissions found.</td></tr>';
        return;
    }

    data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight: 700;">${item.name}</td>
            <td title="${item.question}">${item.question.substring(0, 60)}${item.question.length > 60 ? '...' : ''}</td>
            <td><span class="badge pending" style="background: ${getStatusColor(item.status)}15; color: ${getStatusColor(item.status)}; border-color: ${getStatusColor(item.status)}20;">${item.status}</span></td>
            <td>${item.proof && item.proof !== '#' ? `<a href="${item.proof}" target="_blank" class="btn-icon"><i data-lucide="external-link"></i></a>` : '<i data-lucide="image-off" style="opacity: 0.3;"></i>'}</td>
            <td><button class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="openReply(${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.status}')">Manage</button></td>
        `;
        tbody.appendChild(tr);
    });
    if (window.lucide) lucide.createIcons();
    updateStats(data);
}

function getStatusColor(status) {
    switch(status) {
        case 'Completed': return '#10b981';
        case 'In Progress': return '#6366f1';
        case 'Pending Review': return '#f59e0b';
        default: return '#94a3b8';
    }
}

function updateStats(data) {
    document.getElementById('total-subs').innerText = data.length;
    document.getElementById('pending-subs').innerText = data.filter(i => i.status === 'Pending Review').length;
    document.getElementById('completed-subs').innerText = data.filter(i => i.status === 'Completed').length;
}

let activeReplyId = null;
function openReply(id, name, currentStatus) {
    activeReplyId = id;
    document.getElementById('reply-user').innerText = `Managing Request for ${name}`;
    document.getElementById('update-status').value = currentStatus;
    document.getElementById('reply-modal').style.display = 'flex';
}

function closeReply() {
    document.getElementById('reply-modal').style.display = 'none';
}

function submitReply() {
    const status = document.getElementById('update-status').value;
    const advice = document.getElementById('reply-text').value;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler((res) => {
                if (res.success) {
                    showToast('Submission updated!', 'success');
                    closeReply();
                    refreshData();
                } else {
                    showToast('Error: ' + res.error, 'error');
                }
            })
            .updateSubmission(adminAuthToken, activeReplyId, status, advice);
    } else {
        showToast('Status updated (Demo Mode)!', 'success');
        closeReply();
        refreshData();
    }
}

function goToPage(page) {
    if (typeof google !== 'undefined' && google.script && google.script.host) {
        google.script.run.withSuccessHandler(url => {
           window.open(url + '?p=' + page, '_top');
        }).getScriptUrl();
    } else {
        window.location.href = page + '.html';
    }
}
</script>
