<style>
:root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --secondary: #a855f7;
    --bg-light: #f8fafc;
    --bg-dark: #0f172a;
    --text-light: #1e293b;
    --text-dark: #f1f5f9;
    --glass-light: rgba(255, 255, 255, 0.7);
    --glass-dark: rgba(30, 41, 59, 0.7);
    --border-light: rgba(0, 0, 0, 0.1);
    --border-dark: rgba(255, 255, 255, 0.1);
    --success: #10b981;
    --pending: #f59e0b;
}

[data-theme="light"] {
    --bg: var(--bg-light);
    --text: var(--text-light);
    --glass: var(--glass-light);
    --border: var(--border-light);
}

[data-theme="dark"] {
    --bg: var(--bg-dark);
    --text: var(--text-dark);
    --glass: var(--glass-dark);
    --border: var(--border-dark);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
    background-color: var(--bg);
    color: var(--text);
    transition: background-color 0.3s, color 0.3s;
    line-height: 1.6;
    overflow-x: hidden;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
}

/* Navigation */
.glass-nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    backdrop-filter: blur(12px);
    background: var(--glass);
    border-bottom: 1px solid var(--border);
    height: 70px;
    display: flex;
    align-items: center;
}

.nav-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.icon-purple { color: var(--secondary); }

.btn-icon {
    background: none;
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.btn-icon:hover {
    background: var(--border);
}

[data-theme="dark"] .sun-icon { display: block; }
[data-theme="dark"] .moon-icon { display: none; }
[data-theme="light"] .sun-icon { display: none; }
[data-theme="light"] .moon-icon { display: block; }

/* Hero Section */
.hero-section {
    padding: 150px 0 80px;
    text-align: center;
}

.gradient-text {
    font-size: 3.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 20px;
    line-height: 1.1;
}

.subtitle {
    font-size: 1.25rem;
    color: #94a3b8;
    max-width: 600px;
    margin: 0 auto 40px;
}

/* Glass Card */
.glass-card {
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    margin-bottom: 80px;
}

/* Form Steps */
.form-step {
    display: none;
    animation: fadeIn 0.4s ease-out;
}

.form-step.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-step h2 {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.form-step p {
    color: #94a3b8;
    margin-bottom: 30px;
}

/* Inputs */
.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

input[type="text"],
input[type="password"],
textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 1rem;
    transition: 0.2s;
}

input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
}

/* Buttons */
.btn-primary {
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.2s;
}

.btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.btn-secondary:hover {
    background: var(--border);
}

.w-full { width: 100%; }

.btn-group {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

/* Payment Info */
.payment-info {
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 30px;
    text-align: center;
}

.payment-details {
    margin: 20px 0;
    font-size: 1.1rem;
}

.btn-copy {
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    padding: 4px;
}

.qris-placeholder {
    margin: 20px auto;
    padding: 20px;
    background: white;
    width: fit-content;
    border-radius: 12px;
    color: black;
}

/* File Upload */
.custom-file-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 30px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.custom-file-upload:hover {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.05);
}

.custom-file-upload input[type="file"] {
    display: none;
}

#file-name-display {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--success);
    text-align: center;
}

/* Success */
.text-center { text-align: center; }

.success-icon {
    margin-bottom: 20px;
    color: var(--success);
}

.badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
}

.badge.pending {
    background: rgba(245, 158, 11, 0.1);
    color: var(--pending);
}

/* Features */
.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    margin-bottom: 80px;
}

.feature-card {
    background: var(--glass);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: 0.3s;
}

.feature-card:hover {
    transform: translateY(-10px);
}

.feature-card i {
    color: var(--primary);
    margin-bottom: 20px;
}

.feature-card h3 {
    margin-bottom: 10px;
}

.feature-card p {
    color: #94a3b8;
}

/* Footer */
footer {
    text-align: center;
    padding: 40px;
    border-top: 1px solid var(--border);
    color: #94a3b8;
}

/* Admin Styles */
.admin-container {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 100vh;
    padding-top: 70px;
}
aside {
    background: var(--glass);
    border-right: 1px solid var(--border);
    padding: 30px 20px;
}
.admin-main {
    padding: 40px;
}
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}
.stat-card {
    background: var(--glass);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid var(--border);
    text-align: center;
}
.stat-value {
    font-size: 2rem;
    font-weight: 800;
    color: var(--primary);
}
.submissions-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--glass);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
}
th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid var(--border);
}
th {
    background: rgba(255,255,255,0.05);
    font-weight: 600;
}
.status-pill {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
}
.status-pending-payment { background: rgba(148, 163, 184, 0.1); color: #94a3b8; }
.status-pending-review { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
.status-in-progress { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
.status-completed { background: rgba(16, 185, 129, 0.1); color: #10b981; }

#login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Responsive */
@media (max-width: 768px) {
    .gradient-text { font-size: 2.5rem; }
    .hero-section { padding: 120px 0 60px; }
    .glass-card { padding: 25px; }
    .admin-container { grid-template-columns: 1fr; }
    aside { display: none; }
}
</style>
