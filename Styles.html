<style>
  :root {
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.5);
    --secondary: #a855f7;
    --bg-dark: #020617;
    --bg-light: #f8fafc;
    --glass-dark: rgba(15, 23, 42, 0.7);
    --glass-light: rgba(255, 255, 255, 0.7);
    --text-dark: #f1f5f9;
    --text-light: #0f172a;
    --border-dark: rgba(255, 255, 255, 0.1);
    --border-light: rgba(0, 0, 0, 0.1);

    /* Current Theme Variables */
    --bg: var(--bg-dark);
    --glass: var(--glass-dark);
    --text: var(--text-dark);
    --border: var(--border-dark);
  }

  [data-theme="light"] {
    --bg: var(--bg-light);
    --glass: var(--glass-light);
    --text: var(--text-light);
    --border: var(--border-light);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.3s, color 0.3s;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow-x: hidden;
    user-select: none;
    min-height: 100vh;
  }

  /* Glassmorphism Classes */
  .glass-card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }

  /* Splash Screen */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }

  .loader {
    width: 48px;
    height: 48px;
    border: 5px solid #1e293b;
    border-top: 5px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    margin-bottom: 24px;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Navigation Bar */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    height: 70px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }

  /* Sidebar */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    background: var(--bg-dark);
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }

  .side-btn {
    background: transparent;
    border: none;
    color: var(--text-dark);
    padding: 16px;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    border-radius: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .side-btn:hover, .side-btn.active {
    background: var(--primary);
    color: white;
  }

  /* Main Container */
  .container {
    max-width: 450px;
    margin: 0 auto;
    padding: 100px 20px 40px;
  }

  /* Inputs & Buttons */
  input {
    width: 100%;
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-glow);
  }

  button.primary {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--primary-glow);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button.primary:active {
    transform: scale(0.98);
  }

  .hidden { display: none !important; }

  /* Profile/Dashboard Components */
  .profile-container {
    text-align: center;
    padding: 32px;
  }

  .profile-avatar {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 30px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    box-shadow: 0 10px 25px var(--primary-glow);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  /* Chat/Comment Section */
  .comment-area {
    margin-top: 24px;
    max-height: 400px;
    overflow-y: auto;
    padding: 8px;
  }

  .comment-bubble {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  /* Modal Styles */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 2000;
    backdrop-filter: blur(8px);
  }
</style>
